services:
  dvaa:
    build: .
    # Passes the shell's DVAA_TELEMETRY into the container only when it is set.
    environment:
      - DVAA_TELEMETRY
      # Free local LLM (requires --profile llm and a pulled model)
      - DVAA_LLM_PROVIDER=${DVAA_LLM_PROVIDER:-}
      - DVAA_LLM_MODEL=${DVAA_LLM_MODEL:-llama3.2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - DVAA_HOST=0.0.0.0
    ports:
      - "127.0.0.1:7001:7001"
      - "127.0.0.1:7002:7002"
      - "127.0.0.1:7003:7003"
      - "127.0.0.1:7004:7004"
      - "127.0.0.1:7005:7005"
      - "127.0.0.1:7006:7006"
      - "127.0.0.1:7007:7007"
      - "127.0.0.1:7008:7008"
      - "127.0.0.1:7010:7010"
      - "127.0.0.1:7011:7011"
      - "127.0.0.1:7012:7012"
      - "127.0.0.1:7013:7013"
      - "127.0.0.1:7014:7014"
      - "127.0.0.1:7015:7015"
      - "127.0.0.1:7016:7016"
      - "127.0.0.1:7017:7017"
      - "127.0.0.1:7018:7018"
      - "127.0.0.1:7020:7020"
      - "127.0.0.1:7021:7021"
      - "127.0.0.1:7022:7022"
      - "127.0.0.1:7023:7023"
      - "127.0.0.1:9000:9000"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
